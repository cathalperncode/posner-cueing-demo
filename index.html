<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Posner Cueing · Attention Lab</title>
  <!-- SETUP: Paste your NEW Posner Apps Script web-app /exec URL below.
       Leave empty to run locally with downloadable data only.
       This HTML file is the only file GitHub Pages needs. -->
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSu7snN_fhdKkIjhL-vmCkWE9mKOEISZYDrhYOfLV6FDZktDdOj_jZ2sJHD-0LE7SS/exec";
  </script>
  <style>
    :root { --ink:#14242a; --muted:#4e6168; --accent:#16596a; --line:#d4dddf; --paper:#fff; --task-gray:#a0a0a0; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#edf1f2; line-height:1.55; }
    button,input { font:inherit; }
    button { border:1px solid var(--accent); border-radius:9px; padding:13px 21px; background:var(--accent); color:#fff; font-weight:650; cursor:pointer; }
    button:hover { filter:brightness(.94); }
    button:disabled { cursor:wait; opacity:.6; }
    button.secondary { background:#fff; color:var(--accent); }
    button:focus-visible,input:focus-visible,a:focus-visible { outline:3px solid #c78121; outline-offset:4px; }
    input { display:block; width:100%; padding:12px 14px; border:1px solid #9caeb3; border-radius:7px; background:#fff; color:var(--ink); }
    label { display:block; font-weight:600; }
    label small { display:block; font-weight:400; margin:3px 0 8px; color:var(--muted); }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:clamp(32px,4.5vw,48px); line-height:1.13; letter-spacing:-.035em; margin-bottom:20px; }
    h2 { font-size:25px; line-height:1.25; }
    h3 { font-size:19px; line-height:1.3; }
    p { margin-bottom:15px; }
    strong { font-weight:700; }
    kbd { display:inline-block; background:#eff2f3; color:#172b33; border:1px solid #c1cdd0; border-bottom:3px solid #aebec3; border-radius:5px; padding:1px 10px; font:650 .95em system-ui,sans-serif; }
    #screen { max-width:1000px; margin:0 auto; padding:44px 28px 56px; }
    .eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.17em; font-weight:750; color:var(--accent); margin-bottom:15px; }
    .lead { font-size:20px; max-width:760px; }
    .muted { color:var(--muted); }
    .small { font-size:14px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:27px; margin:22px 0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .grid>.panel { margin:0; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:24px; }
    .note { border-left:3px solid #7a969f; padding-left:16px; font-size:15px; color:var(--muted); margin:22px 0; }
    .notice { padding:13px 16px; border-radius:8px; background:#e8f0f2; margin:16px 0; font-size:14px; }
    .error { background:#fff0e8; color:#733818; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin:22px 0; }
    .step { background:#f5f7f7; border:1px solid var(--line); border-radius:10px; padding:18px 14px; text-align:center; }
    .step .num { font-size:12px; font-weight:750; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
    .step .symbol { display:flex; height:85px; align-items:center; justify-content:center; font-size:44px; font-weight:600; }
    .ring { width:49px; height:49px; border:5px solid #c60000; border-radius:50%; display:inline-block; }
    .mini { background:var(--task-gray); border-radius:8px; position:relative; height:140px; margin-bottom:19px; overflow:hidden; }
    .mini .fix { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#000; font-size:31px; line-height:1; }
    .mini .ring { position:absolute; left:24%; top:50%; transform:translate(-50%,-50%); }
    .mini .arrow { position:absolute; left:50%; top:13%; transform:translateX(-50%); color:#000; font-size:45px; line-height:1; }
    .checks { padding-left:22px; font-size:18px; }
    .checks li { margin:10px 0; padding-left:3px; }
    .table-scroll { overflow:auto; }
    table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
    th,td { text-align:right; padding:15px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th:first-child,td:first-child { text-align:left; white-space:normal; }
    th { color:var(--muted); font-size:13px; font-weight:650; }
    td { font-size:17px; }
    .effect { font-weight:750; color:var(--accent); }
    .footer { margin-top:30px; font-size:12px; color:var(--muted); }
    #experiment { position:fixed; inset:0; width:100vw; height:100vh; display:none; background:var(--task-gray); }
    body.testing { overflow:hidden; background:var(--task-gray); cursor:none; }
    body.testing #screen { display:none; }
    body.testing #experiment { display:block; }
    [hidden] { display:none !important; }
    @media(max-width:700px) { #screen { padding:25px 19px; } .grid { grid-template-columns:1fr; } .panel { padding:20px; } .steps { gap:8px; } .step { padding:12px 8px; } .lead { font-size:18px; } }
  </style>
</head>
<body>
  <main id="screen" aria-live="polite"></main>
  <canvas id="experiment" aria-label="Visual attention task. Keep looking at the central cross and press Space when the black X appears."></canvas>
  <noscript>This task requires JavaScript and a physical keyboard.</noscript>
  <script>
  "use strict";

  const TASK_VERSION = "posner-1.0.0";
  const SETTINGS = Object.freeze({
    trialsPerBlock:50, validPerBlock:35, fixationMs:800, cueDurationMs:100,
    peripheralSOAMs:150, endogenousSOAMs:500, responseDeadlineMs:1500,
    itiMs:650, countdownMs:3000, minimumRTMs:100,
    background:"#a0a0a0", cueColor:"#c60000", targetSizePx:48,
    cueDiameterPx:84, fixationSizePx:28, minWidth:700, minHeight:440
  });
  const STORAGE_KEY = "posner_cueing_v1";
  const SESSION_PREFIX = `${STORAGE_KEY}:session:`;
  const BATCH_PREFIX = `${STORAGE_KEY}:batch:`;
  const LATEST_SESSION_KEY = `${STORAGE_KEY}:latest`;
  const BLOCKS = [
    {number:1, type:"peripheral", label:"Peripheral cue", soa:SETTINGS.peripheralSOAMs},
    {number:2, type:"endogenous", label:"Central arrow", soa:SETTINGS.endogenousSOAMs}
  ];
  const TRIAL_COLUMNS = ["record_id","session_id","participant_id","class_id","task_version","block_number","cue_type","trial_in_block","trial_global","cue_side","target_side","validity","responded","response_status","rt_ms","anticipation_count","first_early_response_phase","first_early_response_time_ms","miss","analysis_include","exclusion_reason","fixation_ms_planned","cue_duration_ms_planned","cue_target_soa_ms_planned","cue_target_gap_ms_planned","response_deadline_ms","iti_ms_planned","cue_duration_ms_actual","cue_target_soa_ms_actual","fixation_ms_actual","max_frame_interval_ms","timing_flag","interrupted","interrupt_reason","fullscreen_at_target","viewport_width","viewport_height","pixel_ratio","target_offset_px","target_size_px","cue_diameter_px","timestamp_utc","timestamp_local","timezone","utc_offset_minutes","target_onset_utc","response_timestamp_utc","server_received_utc"];
  const BLOCK_COLUMNS = ["record_id","session_id","participant_id","class_id","task_version","block_number","cue_type","n_trials","n_valid","n_invalid","n_responded","n_misses","n_anticipatory_trials","n_interrupted","n_timing_flagged","n_included_valid","n_included_invalid","mean_rt_valid_ms","mean_rt_invalid_ms","median_rt_valid_ms","median_rt_invalid_ms","cueing_effect_ms","block_start_utc","block_end_utc","timestamp_utc","timestamp_local","timezone","utc_offset_minutes","server_received_utc"];
  const screenEl = document.getElementById("screen");
  const canvas = document.getElementById("experiment");
  const ctx = canvas.getContext("2d", {alpha:false});
  const state = {
    phase:"idle", active:false, session:null, blockIndex:0, trialIndex:0,
    current:null, raf:0, lastFrame:null, frameSamples:[], frameMs:1000/60,
    countdownStart:0, lastCountdown:null, itiStart:0, spaceDown:false,
    wasFullscreen:false, blockStartUTC:"", geometry:null, saveBusy:false,
    storageOK:true, storageWarning:"", page:"launcher"
  };
  let store = loadStore();
  let taskWindow = null;

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
  }
  function randomUnit() {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296;
  }
  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    a[6]=(a[6]&15)|64; a[8]=(a[8]&63)|128;
    const s = Array.from(a,x=>x.toString(16).padStart(2,"0")).join("");
    return `${s.slice(0,8)}-${s.slice(8,12)}-${s.slice(12,16)}-${s.slice(16,20)}-${s.slice(20)}`;
  }
  function shuffle(a) {
    for(let i=a.length-1;i>0;i--) { const j=Math.floor(randomUnit()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function makeSchedule() {
    // Exact 35/15 validity and 25/25 target sides. With 35 valid trials,
    // cue sides cannot ALSO be 25/25; they are 26/24, randomized per block.
    const extraValidSide = randomUnit()<.5 ? "left" : "right";
    const rows=[];
    for(const target of ["left","right"]) {
      const nValid=target===extraValidSide ? 18 : 17;
      for(let i=0;i<25;i++) {
        const valid=i<nValid;
        rows.push({target_side:target,cue_side:valid?target:(target==="left"?"right":"left"),validity:valid?"valid":"invalid"});
      }
    }
    return shuffle(rows);
  }
  function rounded(n) { return Number.isFinite(n) ? Math.round(n*1000)/1000 : null; }
  function mean(a) { return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
  function median(a) {
    if(!a.length) return null;
    const b=[...a].sort((x,y)=>x-y), m=Math.floor(b.length/2);
    return b.length%2 ? b[m] : (b[m-1]+b[m])/2;
  }
  function timestamps(date=new Date()) {
    const pad=n=>String(n).padStart(2,"0");
    const offset=-date.getTimezoneOffset(), sign=offset>=0?"+":"-", abs=Math.abs(offset);
    const local=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${String(date.getMilliseconds()).padStart(3,"0")}${sign}${pad(Math.floor(abs/60))}:${pad(abs%60)}`;
    let zone="unknown"; try { zone=Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown"; } catch(_) {}
    return {timestamp_utc:date.toISOString(),timestamp_local:local,timezone:zone,utc_offset_minutes:offset};
  }
  function storageProblem() {
    state.storageOK=false;state.storageWarning="Local backup is unavailable. Keep this window open and download your data.";
  }
  function mergeSessionReceipts(session,receipts) {
    if(!session)return;
    const merged=new Map((session.receipts||[]).map(r=>[r.batch_id,r]));
    for(const r of receipts)if(r.session_id===session.session_id)merged.set(r.batch_id,{
      batch_id:r.batch_id,block_number:r.block_number,server_received_utc:r.server_received_utc});
    session.receipts=[...merged.values()];
  }
  function readStoredState() {
    const outbox=[],receipts=[];
    for(let i=0;i<localStorage.length;i++) {
      const key=localStorage.key(i);if(!key?.startsWith(BATCH_PREFIX))continue;
      const item=JSON.parse(localStorage.getItem(key)||"null");
      if(item?.status==="pending" && item.job?.payload?.batch_id)outbox.push({...item.job,stored:true});
      else if(item?.status==="confirmed")receipts.push({...item,stored:true});
    }
    const latestID=localStorage.getItem(LATEST_SESSION_KEY);
    const latest=latestID?JSON.parse(localStorage.getItem(SESSION_PREFIX+latestID)||"null"):null;
    mergeSessionReceipts(latest,receipts);
    return {latest,outbox,receipts};
  }
  function loadStore() {
    try{return readStoredState();}
    catch(error){storageProblem();return {latest:null,outbox:[],receipts:[]};}
  }
  function refreshStore() {
    try {
      const incoming=readStoredState();
      const receipts=new Map((store.receipts||[]).map(r=>[r.batch_id,r]));
      for(const r of incoming.receipts)receipts.set(r.batch_id,r);
      store.receipts=[...receipts.values()];
      // Only never-stored jobs need an in-memory fallback. A stale window must
      // not rewrite a batch that another window has already acknowledged.
      const jobs=new Map(incoming.outbox.map(j=>[j.payload.batch_id,j]));
      for(const j of store.outbox)if(!j.stored && !jobs.has(j.payload.batch_id))jobs.set(j.payload.batch_id,j);
      store.outbox=[...jobs.values()].filter(j=>!receipts.has(j.payload.batch_id));
      store.latest=state.session || incoming.latest;
      mergeSessionReceipts(store.latest,store.receipts);
      return true;
    } catch(error){storageProblem();return false;}
  }
  function persist(makeLatest=false) {
    if(!state.session)return;
    store.latest=state.session;mergeSessionReceipts(state.session,store.receipts);
    try {
      // Only this run's owning window writes its session. The launcher never
      // rewrites someone else's snapshot while retrying a pending upload.
      localStorage.setItem(SESSION_PREFIX+state.session.session_id,JSON.stringify(state.session));
      if(makeLatest)localStorage.setItem(LATEST_SESSION_KEY,state.session.session_id);
      if(store.outbox.every(j=>j.stored) && store.receipts.every(r=>r.stored)) {
        state.storageOK=true;state.storageWarning="";
      }
    } catch(error){storageProblem();}
  }
  function storePendingJob(job) {
    try {
      const key=BATCH_PREFIX+job.payload.batch_id,existing=JSON.parse(localStorage.getItem(key)||"null");
      if(existing?.status==="confirmed") {
        store.receipts.push({...existing,stored:true});
        store.outbox=store.outbox.filter(j=>j.payload.batch_id!==job.payload.batch_id);
        return;
      }
      if(!existing)localStorage.setItem(key,JSON.stringify({status:"pending",job:{
        endpoint:job.endpoint,payload:job.payload,attempts:0,last_error:""}}));
      job.stored=true;
    } catch(error){job.stored=false;storageProblem();}
  }
  function confirmBatch(job,receipt) {
    const saved={status:"confirmed",session_id:job.payload.session_id,batch_id:job.payload.batch_id,
      block_number:job.payload.blocks[0].block_number,server_received_utc:receipt.server_received_utc};
    let stored=false;
    try {
      // Replace this one batch with a small permanent acknowledgement. Stale
      // retries never write pending entries, so they cannot resurrect it.
      localStorage.setItem(BATCH_PREFIX+saved.batch_id,JSON.stringify(saved));stored=true;
    } catch(error){storageProblem();}
    store.receipts=store.receipts.filter(r=>r.batch_id!==saved.batch_id);
    store.receipts.push({...saved,stored});
    store.outbox=store.outbox.filter(j=>j.payload.batch_id!==saved.batch_id);
    mergeSessionReceipts(state.session,store.receipts);mergeSessionReceipts(store.latest,store.receipts);
    // A batch receipt is not necessarily the original per-row timestamp after
    // a partial write. Local row timestamps remain blank; Sheets owns them.
  }
  function endpointReady() {
    return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(GOOGLE_SCRIPT_URL.trim());
  }
  function footer() { return `<p class="footer">${TASK_VERSION} · Two blocks · 50 trials per block · Physical keyboard required</p>`; }
  function setPage(html,name) {
    state.page=name; document.body.classList.remove("testing"); screenEl.innerHTML=html+footer(); window.scrollTo(0,0);
  }
  function bind(id,fn) { const el=document.getElementById(id); if(el) el.addEventListener("click",fn); }
  function backupContents() {
    const pending=store.outbox.filter(j=>j.endpoint===GOOGLE_SCRIPT_URL.trim()).length;
    const hasRun=Boolean(store.latest?.trials?.length);if(!hasRun && !pending)return "";
    return `<div class="notice">${hasRun?`A previous run is saved in this browser (${store.latest.trials.length} recorded trials). <button class="secondary" id="previous-data" type="button">Download previous run</button>`:""}${pending?`<p id="previous-save-note" style="margin:12px 0 6px">${pending} completed block${pending===1?"":"s"} awaiting Google Sheets confirmation.</p><button class="secondary" id="previous-retry" type="button">Retry pending saves</button>`:""}</div>`;
  }
  function backupPanel() {return `<div id="backup-panel">${backupContents()}</div>`;}
  function updateBackupPanel() {
    const panel=document.getElementById("backup-panel");
    if(panel && !state.saveBusy){panel.innerHTML=backupContents();wireBackup();}
  }
  function wireBackup() {
    bind("previous-data",()=>downloadJSON(store.latest));
    bind("previous-retry",async()=>{
      const button=document.getElementById("previous-retry");button.disabled=true;await flushOutbox();
      const pending=store.outbox.filter(j=>j.endpoint===GOOGLE_SCRIPT_URL.trim()).length;
      const note=document.getElementById("previous-save-note");
      if(note)note.textContent=pending?`${pending} completed block${pending===1?"":"s"} still awaiting confirmation. Keep the downloaded backup.`:"Google Sheets confirmed all pending blocks saved.";
      button.disabled=false;
    });
  }
  function showLauncher() {
    setPage(`<p class="eyebrow">Attention lab</p><h1>Where does your<br>attention go?</h1>
      <p class="lead">A Posner cueing demonstration: detect a black X after a peripheral flash or a central arrow.</p>
      <div class="panel"><h2>Before you begin</h2><p>Use a desktop or laptop with a keyboard. The task has <strong>two blocks of 50 trials</strong> and takes about 4 minutes, plus instructions.</p>
      <p>The task opens in a separate window. Click <strong>Begin block 1</strong> in that window to enter fullscreen and start a three-second countdown.</p>
      <div class="actions"><button id="open-task" type="button">Open task in a new window</button><button id="same-window" class="secondary" type="button">Use this window</button></div>
      <p class="small muted" id="launch-note" style="margin-top:15px;margin-bottom:0">Your browser may choose a tab instead of a window. The task itself will still request fullscreen.</p></div>
      ${backupPanel()}${state.storageWarning?`<p class="notice error">${escapeHTML(state.storageWarning)}</p>`:""}`,"launcher");
    bind("same-window",showFirstInstructions);
    bind("open-task",()=>{
      const url=new URL(location.href); url.searchParams.set("run","1");
      const w=Math.max(800,window.screen.availWidth), h=Math.max(600,window.screen.availHeight);
      if(taskWindow && !taskWindow.closed) { taskWindow.focus(); return; }
      taskWindow=window.open(url.href,"posner_cueing_task",`popup=yes,width=${w},height=${h},left=0,top=0,resizable=yes,scrollbars=yes`);
      if(taskWindow) { taskWindow.focus(); document.getElementById("launch-note").textContent="The task window is open. Continue there."; }
      else { showFirstInstructions(); const note=document.getElementById("setup-note"); note.textContent="The browser blocked a new window, so the task will run here."; }
    });
    wireBackup();
  }
  function showFirstInstructions() {
    setPage(`<p class="eyebrow">Block 1 of 2 · 50 trials</p><h1>Watch the center.<br>Respond to the X.</h1>
      <p class="lead">A red circle will briefly appear on the left or right of the fixation cross. Then a black <strong>X</strong> will appear on either side.</p>
      <div class="steps"><div class="step"><span class="num">1 · Keep looking</span><div class="symbol">+</div><span>Eyes on the central cross</span></div><div class="step"><span class="num">2 · Wait</span><div class="symbol"><span class="ring"></span></div><span>Do not respond to the circle</span></div><div class="step"><span class="num">3 · Respond</span><div class="symbol">X</div><span>Press <kbd>Space</kbd> for the X</span></div></div>
      <ul class="checks"><li>Press <kbd>Space</kbd> as quickly as you can <strong>when the X appears</strong>, whichever side it is on.</li><li>Keep your eyes on the cross throughout each trial. Release Space between responses.</li><li>The X appears where the circle was on <strong>70% of trials</strong> and on the opposite side on <strong>30%</strong>.</li></ul>
      <div class="panel"><div class="grid"><label>Participant code<small>Use your assigned code, or leave blank for an anonymous code.</small><input id="participant-id" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="e.g., P012"></label><label>Class / group code<small>Optional. Use the code provided by your instructor.</small><input id="class-id" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="Optional"></label></div>
      <p id="setup-note" class="small muted" style="margin-top:16px">Place a finger on Space. A 3–2–1 countdown will appear before the first trial. Press Escape to pause.</p>
      <p id="start-error" class="notice error" hidden></p><div class="actions"><button id="begin-first" type="button">Begin block 1 · Fullscreen</button></div></div>
      <p class="small muted">${endpointReady()?"Trial results will be submitted to the instructor’s Google Sheet. You can also download a copy at the end.":"Google Sheets is not connected in this copy. The task still runs and provides downloadable data."}</p>${backupPanel()}`,"instructions1");
    bind("begin-first",async()=>{
      const button=document.getElementById("begin-first"); button.disabled=true;
      const participant=document.getElementById("participant-id").value.trim() || `anon-${uuid().slice(0,8)}`;
      const classID=document.getElementById("class-id").value.trim();
      await requestTaskFullscreen();
      if(!screenLargeEnough()) { showStartError("Use a larger desktop/laptop window (at least 700 × 440 pixels).",button); return; }
      state.session={session_id:uuid(),participant_id:participant,class_id:classID,task_version:TASK_VERSION,
        created_utc:new Date().toISOString(),completed:false,settings:{...SETTINGS},
        schedules:[makeSchedule(),makeSchedule()],trials:[],blocks:[],receipts:[]};
      persist(true); state.blockIndex=0; state.trialIndex=0; state.blockStartUTC=new Date().toISOString();
      startCountdown();
    }); wireBackup();
  }
  function showStartError(message,button) {
    const el=document.getElementById("start-error"); if(el) {el.textContent=message;el.hidden=false;} button.disabled=false;
  }
  function screenLargeEnough() { return innerWidth>=SETTINGS.minWidth && innerHeight>=SETTINGS.minHeight; }
  async function requestTaskFullscreen() {
    if(!document.fullscreenElement && document.documentElement.requestFullscreen) {
      try { await document.documentElement.requestFullscreen(); } catch(_) { /* Windowed continuation is supported. */ }
    }
    // Let fullscreen resize settle before the timing-sensitive display starts.
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  }
  function geometry() {
    return {width:innerWidth,height:innerHeight,cx:innerWidth/2,cy:innerHeight/2,
      offset:Math.min(360,Math.max(180,innerWidth*.26)),dpr:window.devicePixelRatio||1};
  }
  function sizeCanvas() {
    state.geometry=geometry(); const g=state.geometry;
    canvas.width=Math.round(g.width*g.dpr); canvas.height=Math.round(g.height*g.dpr);
    ctx.setTransform(g.dpr,0,0,g.dpr,0,0);
  }
  function drawBase() {

  window.addEventListener("resize",()=>{
    if(!state.active)return;
    if(state.phase==="countdown"){sizeCanvas();state.lastCountdown=null;}
    else if(state.geometry && (innerWidth!==state.geometry.width || innerHeight!==state.geometry.height))pauseTask("window_resized");
  });
  window.addEventListener("online",()=>{if(!state.active)void flushOutbox();});
  window.addEventListener("storage",event=>{
    if(event.key && event.key!==LATEST_SESSION_KEY && !event.key.startsWith(SESSION_PREFIX) && !event.key.startsWith(BATCH_PREFIX))return;
    refreshStore();updateSaveStatus();
    if(state.page==="launcher" || state.page==="instructions1")updateBackupPanel();
  });
  window.addEventListener("beforeunload",event=>{
    if(state.active){persist();event.preventDefault();event.returnValue="";}
  });
  // Retry existing outbox batches only on a user request or online event, not while a trial is running.
  if(new URLSearchParams(location.search).get("run")==="1")showFirstInstructions();else showLauncher();
  </script>
</body>
</html>
